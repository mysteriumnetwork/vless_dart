name: CI

# The Xray core lives in github.com/mysteriumnetwork/vless-core and is tested
# there. The native jobs exist because nothing else compiles the plugin's
# Kotlin, Swift or C++: `flutter analyze` reads Dart only, so a build break in
# any of them is invisible until someone opens that platform by hand.
#
# None of this brings a tunnel up. That needs a device, a VPN entitlement or an
# elevated Windows session, and stays a manual check.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    # A hung test would otherwise hold a runner for the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0 #v1.0 is tag, v1 is branch
        with:
          version: 4.0.5

      - name: Install Flutter SDK
        run: echo yes | fvm use

      - run: fvm flutter pub get

      - name: Format
        run: fvm dart format --line-length 100 --set-exit-if-changed lib test example/lib

      - name: Analyze
        run: fvm flutter analyze

      - name: Test
        run: fvm flutter test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Gradle wrapper and AGP both need 17, and the image's default is
      # not promised to stay there.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0 #v1.0 is tag, v1 is branch
        with:
          version: 4.0.5

      - name: Install Flutter SDK
        run: echo yes | fvm use

      # Builds the plugin as an app does: its Kotlin and AIDL, the manifest
      # merge, and the core download. Then the JVM unit tests, which ran
      # nowhere before this job.
      - name: Build the example and run the Kotlin tests
        run: make test-android

  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0 #v1.0 is tag, v1 is branch
        with:
          version: 4.0.5

      - name: Install Flutter SDK
        run: echo yes | fvm use

      # The example that hosts these carries a NetworkExtension entitlement,
      # which no identity on a runner can sign for. With signing switched off
      # the host carries no entitlement at all and launches; the tests are
      # control-plane logic and never reach one.
      - name: Swift tests, hosted by the macOS example
        run: make test-swift SWIFT_TEST_SIGNING=off

      # iOS shares the plugin's sources but not its packet tunnel target, so
      # the macOS build above says nothing about whether this one links.
      - name: Build the iOS example
        working-directory: example
        run: fvm flutter build ios --debug --no-codesign

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # setup-fvm is Linux and macOS only, so this job installs the SDK
      # directly -- still the version .fvmrc pins, read from it rather than
      # written out twice.
      - name: Read the pinned Flutter version
        id: pinned
        shell: pwsh
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pinned.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Builds the plugin as the app does, which also exercises the core
      # download and its SHA-256 pins. include_vless_dart_tests is set by the
      # example, so this configures the gtest target too.
      - name: Build the example
        working-directory: example
        run: flutter build windows --debug

      # The golden vector here is the only guard against the C++ and Go wire
      # encoders drifting apart. The rest starts, stops and kills a stand-in
      # for the core, which is as much of that code as runs without elevation.
      - name: Plugin tests
        working-directory: example
        shell: pwsh
        run: |
          $runner = Get-ChildItem -Path build\windows\x64 -Recurse `
            -Filter vless_dart_test.exe | Select-Object -First 1
          if (-not $runner) { throw "vless_dart_test.exe was not built" }
          & $runner.FullName
          if ($LASTEXITCODE -ne 0) { throw "plugin tests failed" }
