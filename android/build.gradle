group 'network.mysterium.vless_dart'
version '1.0-SNAPSHOT'

// The core is published as XRay.aar beside XRay.xcframework, so one release
// pins Android and Apple to the same Xray-core build.
ext.xrayCoreTag = 'xray-v26.3.27-9'
ext.xrayCoreUrl = "https://github.com/mysteriumnetwork/vless-core/releases/download/${xrayCoreTag}/XRay.aar"
// SHA-256 of that asset, bumped with the tag. A release asset can be replaced
// under an existing tag, and this file is native code that carries every
// packet the user sends: not something to take on trust from a URL. Windows
// and Apple pin theirs the same way, in windows/CMakeLists.txt and in
// vless-core's Package.swift.
ext.xrayCoreSha256 = '460709493cdcd7601f1d49aa7cc12a3388fba51064f1a77b0872e7a242034944'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def xrayDir = file("${buildDir}/xray")
// Named for the tag: a bump must not be satisfied by the previously cached
// download sitting under the same filename.
def xrayAar = file("${xrayDir}/XRay-${xrayCoreTag}.aar")
def xrayUnpacked = file("${xrayDir}/unpacked")

// A local build wins, so the core can be iterated on without publishing a
// release. Resolved against projectDir, not rootDir: when the plugin is built
// inside an app, rootDir is the app's.
def localCore = [
        System.getenv('VLESS_LOCAL_CORE'),
        "${projectDir}/../../vless-core/Artifacts/XRay.aar",
        "${projectDir}/../../vless-apple/Artifacts/XRay.aar",
].findAll { it }.collect { file(it) }.find { it.exists() }

def sha256Of = { File target ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    target.eachByte(1 << 16) { buffer, read -> digest.update(buffer, 0, read) }
    digest.digest().encodeHex().toString()
}

// An aar cannot be nested inside another aar, so the core is unpacked and its
// two halves are fed in separately: the classes as a local jar, which AGP does
// package for consumers, and the .so files as a jniLibs source directory.
def unpackXrayCore = tasks.register('unpackXrayCore') {
    // Without declared inputs the task is UP-TO-DATE across a tag bump or a
    // locally rebuilt core, so a warm build directory keeps linking the old
    // one while this file claims the new one.
    inputs.property('tag', xrayCoreTag)
    inputs.property('sha256', xrayCoreSha256)
    inputs.property('localCore', localCore ? "${localCore}@${localCore.lastModified()}" : '')
    outputs.dir(xrayUnpacked)
    doLast {
        xrayDir.mkdirs()
        def source = localCore
        if (source != null) {
            // Unpacked straight from the override. Copying it into the
            // tag-named cache would outlive the override: the next build finds
            // no local core, sees the cache entry already there, skips the
            // download and keeps shipping the development build.
            logger.lifecycle("vless_dart: using local core ${source}")
        } else {
            if (!xrayAar.exists()) {
                logger.lifecycle("vless_dart: fetching core ${xrayCoreUrl}")
                // Written beside the cache entry and moved in only once the
                // stream completes: a half-written file still satisfies
                // exists(), so a dropped connection would leave every later
                // build skipping the fetch and failing to unpack the remains.
                def partial = file("${xrayAar}.part")
                delete partial
                new URL(xrayCoreUrl).withInputStream { input ->
                    partial.withOutputStream { it << input }
                }
                if (!partial.renameTo(xrayAar)) {
                    xrayAar.bytes = partial.bytes
                    delete partial
                }
            }
            // Checked on every unpack, not only after a download: an entry
            // cached before the pin existed, or altered since, is the same
            // unknown file. A local build above is the developer's own and is
            // not held to it.
            def actual = sha256Of(xrayAar)
            if (actual != xrayCoreSha256) {
                delete xrayAar
                throw new GradleException(
                        "vless_dart: ${xrayCoreUrl} has SHA-256 ${actual}, expected " +
                                "${xrayCoreSha256}. Update xrayCoreSha256 with the tag, " +
                                "or find out why the asset changed.")
            }
            source = xrayAar
        }
        delete xrayUnpacked
        copy {
            from zipTree(source)
            into xrayUnpacked
        }
    }
}

tasks.configureEach { task ->
    // preBuild alone is an anchor the native merge is not guaranteed to run
    // after, so name that task too: losing the race ships an apk with no
    // libgojni.so, which dies at System.loadLibrary on the first connect.
    if (task.name == 'preBuild' || task.name ==~ /merge.*JniLibFolders/) {
        task.dependsOn unpackXrayCore
    }
}

android {
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += "${xrayUnpacked}/jni"
    }

    defaultConfig {
        // Matches the -androidapi the core is built with.
        minSdkVersion 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    // IVlessCore, the binder the plugin's process holds on the tunnel's.
    buildFeatures {
        aidl true
    }

    namespace 'network.mysterium.vless_dart'
}

dependencies {
    // builtBy, not a bare file: a plain path carries no provenance, so the
    // app's dexing task would consume the jar without waiting for the unpack.
    implementation files("${xrayUnpacked}/classes.jar") { builtBy unpackXrayCore }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // android.jar stubs org.json to throw, so unit tests need the real one.
    testImplementation 'org.json:json:20231013'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
