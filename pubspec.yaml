name: vless_dart
description: "VLESS (Xray) client for Flutter — iOS and macOS via NetworkExtension, with status streaming and live traffic stats."
version: 0.0.1
homepage: https://github.com/mysteriumnetwork/vless_dart
repository: https://github.com/mysteriumnetwork/vless_dart

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: 3.44.7

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: VlessDartPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: VlessDartPlugin
        sharedDarwinSource: true
